name: Fetch Hourly Energy & Weather Data

on:
  schedule:
    # Runs every hour at minute 15 (UTC) so Fingrid's previous hour intervals are finalized
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-datasets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch all configured energy and weather datasets
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
        run: python scripts/run_pipeline.py

      - name: Commit and push updated JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "chore(data): update hourly energy and weather datasets"
            git pull --rebase -X ours origin main
            git push origin main
          fi

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-datasets
    steps:
      - name: Checkout updated main branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production Vite bundle
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
